<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguyễn Trung Kiên | Admin Trung Gian</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #ffcc00; --blue: #00d2ff; --dark: #020617; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--dark);
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid var(--gold);
            border-radius: 25px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
        }
        .avatar img {
            width: 130px; height: 130px;
            border-radius: 50%;
            border: 4px solid var(--gold);
            object-fit: cover;
            margin-bottom: 15px;
        }
        h1 { color: var(--gold); font-size: 1.5rem; text-transform: uppercase; margin-bottom: 10px; }
        .badge {
            background: linear-gradient(45deg, #b8860b, #ffd700);
            color: #000;
            font-weight: 800;
            padding: 8px 15px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }
        .btn {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn i { font-size: 1.2rem; margin-right: 15px; color: var(--blue); width: 25px; }
        .btn-text { text-align: left; }
        .btn-text span { display: block; font-size: 0.7rem; color: #94a3b8; }
        .note { font-size: 0.75rem; color: #ef4444; margin-top: 15px; font-style: italic; }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">
            <img src="1000007135.jpg" alt="Nguyễn Trung Kiên">
        </div>
        <h1>Nguyễn Trung Kiên</h1>
        <div class="badge">🛡️ ADMIN TG BẢO HIỂM 10M</div>
        <div class="links">
            <a href="https://facebook.com/trungkien1669" class="btn" target="_blank">
                <i class="fab fa-facebook"></i>
                <div class="btn-text"><span>Facebook Cá Nhân</span><b>trungkien1669</b></div>
            </a>
            <a href="https://zalo.me/0365951114" class="btn" target="_blank">
                <i class="fas fa-comment-dots"></i>
                <div class="btn-text"><span>Zalo Liên Hệ</span><b>0365951114</b></div>
            </a>
            <div class="btn">
                <i class="fas fa-check-circle" style="color: var(--gold);"></i>
                <div class="btn-text"><span>Trạng thái</span><b>UY TÍN - AN TOÀN</b></div>
            </div>
        </div>
        <p class="note">⚠️ Check kỹ thông tin trước khi giao dịch!</p>
    </div>
</body>
</html>
